<?xml version="1.0" encoding="UTF-8"?>
<!-- Simplified/bolder redraw of sh-icon.svg for small/inline use (badges,
     running text). The original's fine linework + glow read as an
     illegible smudge below ~40px — this trades the literal letterform and
     kalb-mark chevrons for a single bold stroke, legible down to ~10px.
     Stroke uses currentColor so it inherits whatever contrast-safe color
     the surrounding context already computes (e.g. a card's badge-text
     color) — do not hardcode a fill/stroke color when embedding this. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <path
    fill="none" stroke="currentColor" stroke-width="16"
    stroke-linecap="round" stroke-linejoin="round"
    d="M 72,22 C 72,8 30,8 30,24 C 30,40 70,38 70,56 C 70,76 28,76 28,62" />
  <circle cx="28" cy="62" r="9" fill="#b0102f" />
</svg>
